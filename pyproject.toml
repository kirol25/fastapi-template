[project]
name = "fastapi-template"
version = "0.1.0"
description = "A production-ready FastAPI template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "fastapi>=0.162.0",
    "gunicorn>=23.0.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "structlog>=25.5.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
